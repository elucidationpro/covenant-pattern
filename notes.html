<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Presenter Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Figtree:wght@500;600;700&display=swap">
<style>
  :root{--ink:#121820;--panel:#1B2430;--line:#2C3846;--text:#ECE7DC;--muted:#93A0AE;--accent:#F2B33D;--promise:#78C2F0;--action:#5EC76E;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:Figtree,system-ui,sans-serif}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  header{position:sticky;top:0;background:var(--ink);padding:14px 16px 10px;border-bottom:1px solid var(--line);z-index:2;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  header h1{margin:0;font:500 18px Spectral,Georgia,serif}
  header .now{color:var(--muted);font-size:13px}
  header .now.err{color:#F08A8A}
  .list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .slide{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);cursor:pointer;font:inherit}
  .slide:active{transform:scale(.995)}
  .slide.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(242,179,61,.35) inset}
  .slide.board{border-style:dashed}
  .slide.board.on{border-style:solid}
  .top{display:flex;align-items:baseline;gap:10px}
  .num{font-weight:700;font-size:12px;color:var(--muted);min-width:2.2em;letter-spacing:.04em}
  .slide.on .num{color:var(--accent)}
  .label{font:500 16px Spectral,Georgia,serif;flex:1}
  .notes{margin:8px 0 0;color:#C9C3B6;font-size:14px;line-height:1.45;white-space:pre-wrap}
  .notes:empty{display:none}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;justify-content:space-between}
  .bar button{font:600 16px Figtree,system-ui,sans-serif;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:.7em 1.3em;cursor:pointer}
  .bar button.big{flex:1;background:var(--text);color:var(--ink);border-color:var(--text)}
  .bar button:disabled{opacity:.4}
  .bar .pos{color:var(--muted);font-size:14px;min-width:4em;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Walk in the Light of Your Fire</h1>
  <span class="now" id="now">Connecting…</span>
</header>
<div class="list" id="list"></div>
<div class="bar">
  <button id="prev" aria-label="Previous">&#8592;</button>
  <span class="pos" id="posLabel"></span>
  <button class="big" id="next">Next &#8594;</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="notes-data.js"></script>
<script>
const sb = cpClient();
const SEQ = CP_SEQUENCE.map(s => s.pos);
let pos = null;
const list = document.getElementById('list');

list.innerHTML = CP_SEQUENCE.map(s => {
  const num = s.pos === 'board' ? 'BOARD' : 'SLIDE ' + s.pos;
  return `<button class="slide${s.pos === 'board' ? ' board' : ''}" data-pos="${s.pos}">
    <div class="top"><span class="num">${num}</span><span class="label">${s.label}</span></div>
    <p class="notes">${s.notes.replace(/</g, '&lt;')}</p>
  </button>`;
}).join('');

function paint(scroll) {
  document.querySelectorAll('.slide').forEach(el => el.classList.toggle('on', el.dataset.pos === pos));
  const i = SEQ.indexOf(pos);
  document.getElementById('posLabel').textContent = pos === 'board' ? 'Board' : (pos ? `Slide ${pos}` : '');
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= SEQ.length - 1;
  if (scroll) { const el = document.querySelector('.slide.on'); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}
function setNow(msg, err) { const n = document.getElementById('now'); n.textContent = msg; n.className = 'now' + (err ? ' err' : ''); }

async function go(p) {
  if (!SEQ.includes(p)) return;
  pos = p; paint(false);
  setNow('Sending…');
  const { error } = await sb.from('control').update({ position: p, updated_at: new Date().toISOString() }).eq('id', 1);
  if (error) setNow('Not sent: ' + error.message, true); else setNow('Screen is on ' + (p === 'board' ? 'the board' : 'slide ' + p));
}
list.addEventListener('click', e => { const b = e.target.closest('.slide'); if (b) go(b.dataset.pos); });
document.getElementById('prev').onclick = () => { const i = SEQ.indexOf(pos); if (i > 0) go(SEQ[i - 1]); };
document.getElementById('next').onclick = () => { const i = SEQ.indexOf(pos); if (i < SEQ.length - 1) go(SEQ[i + 1]); };

async function load(scroll) {
  const { data, error } = await sb.from('control').select('position').eq('id', 1).single();
  if (error) { setNow('Offline: ' + error.message, true); return; }
  if (data.position !== pos) { pos = data.position; paint(scroll); }
  setNow('Screen is on ' + (pos === 'board' ? 'the board' : 'slide ' + pos));
}
sb.channel('control-notes')
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'control' }, payload => {
    if (payload.new && payload.new.position !== pos) { pos = payload.new.position; paint(true); setNow('Screen is on ' + (pos === 'board' ? 'the board' : 'slide ' + pos)); }
  })
  .subscribe();
load(true);
setInterval(() => load(false), 4000);
</script>
</body>
</html>
