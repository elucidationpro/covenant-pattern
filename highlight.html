<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Covenant Pattern — Your Highlights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Figtree:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .verses{--vsize:clamp(20px,2.6vw,44px)}
  .app{height:100dvh}
  .view-header{position:sticky;top:0;z-index:2;flex:none;background:var(--ink);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .view-toggle{display:flex;max-width:440px;margin:auto;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .view-toggle button{flex:1;justify-content:center;min-height:44px;border-color:transparent}
  .view-toggle button[aria-pressed=true]{background:var(--text);color:var(--on-hi)}
  #highlightPanel,#groupPanel{flex:1;min-height:0;display:flex;flex-direction:column}
  #highlightPanel[hidden],#groupPanel[hidden]{display:none}
  #groupPreview{width:100%;flex:1;min-height:0;border:0}
  .stage{padding-left:max(clamp(16px,5vw,96px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,5vw,96px),env(safe-area-inset-right,0px))}
  .bar{padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px))}
  .switch-live{background:rgb(242,196,92);color:#10151C;border-color:transparent}
  .back-bar{display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <header class="view-header">
    <div class="view-toggle" role="group" aria-label="Participant view">
      <button id="highlightTab" aria-pressed="true" aria-controls="highlightPanel">Highlight</button>
      <button id="groupTab" aria-pressed="false" aria-controls="groupPanel">Live view</button>
    </div>
  </header>
  <div id="highlightPanel">
  <main class="stage">
    <div class="ref">
      <h1 id="ref"></h1>
      <span class="hint" id="hint">Tap or drag across words to highlight</span>
    </div>
    <div class="verses paintable" id="verses" aria-live="polite"></div>
  </main>
  <nav class="bar" aria-label="Controls">
    <div class="modes" role="group" aria-label="Highlight type"></div>
    <div class="extras">
      <select id="passage" aria-label="Passage"></select>
      <button class="ghost" id="clear">Clear page</button>
      <span class="status" id="status" role="status"></span>
      <button class="switch-live" id="toLive">Switch to live view &#8594;</button>
    </div>
    <div class="pager">
      <button class="arrow" id="prev" aria-label="Previous verses">&#8592;</button>
      <span class="count" id="count">1 / 1</span>
      <button class="arrow" id="next" aria-label="Next verses">&#8594;</button>
    </div>
  </nav>
  </div>
  <section id="groupPanel" aria-label="Live view" hidden>
    <iframe id="groupPreview" title="Live group highlights (read-only)"></iframe>
    <div class="back-bar"><button class="switch-live" id="toHighlight">&#8592; Back to highlighting</button></div>
  </section>
</div>
<div class="verses measure" id="measure" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
cpReady.then(() => {
const $ = id => document.getElementById(id);
const KEY = 'covenant-pattern-v3:' + LESSON.slug;
const state = { passage: Object.keys(PASSAGES)[0], page: 0, mode: CP_MODES[0], pages: [], marks: {}, deviceId: '', pendingSync: false };

// Restore local work. Each device gets a stable id so each save updates the same row.
try {
  const s = JSON.parse(localStorage.getItem(KEY) || (LESSON.legacyStorageKey && localStorage.getItem(LESSON.legacyStorageKey)) || '{}');
  if (s.marks) state.marks = s.marks;
  state.pendingSync = s.pendingSync === true;
  if (s.passage && PASSAGES[s.passage]) state.passage = s.passage;
  if (s.deviceId) state.deviceId = s.deviceId;
} catch (e) {}
if (!state.deviceId) {
  state.deviceId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
}
// Allow preset mode from the link, e.g. highlight.html?mode=promise
const qsMode = new URLSearchParams(location.search).get('mode');
if (CP_MODES.includes(qsMode)) state.mode = qsMode;

function save() {
  try { localStorage.setItem(KEY, JSON.stringify({ marks: state.marks, passage: state.passage, deviceId: state.deviceId, pendingSync: state.pendingSync })); } catch (e) {}
}
save();
let groupView = false;
const VIEW_KEY = KEY + ':view';
const decorate = id => ({ cls: state.marks[id] || '', style: '' });

function render() {
  const pg = state.pages[state.page] || [];
  $('verses').innerHTML = pageHTML(state.passage, pg, decorate);
  $('ref').textContent = refLabel(state.passage, pg);
  $('count').textContent = `${state.page + 1} / ${state.pages.length}`;
  $('prev').disabled = state.page === 0;
  $('next').disabled = state.page >= state.pages.length - 1;
  $('passage').value = state.passage;
}
function relayout() {
  if (groupView) return;
  const box = $('verses'), cols = colsFor(box);
  box.classList.toggle('cols', cols > 1);
  state.pages = paginate(state.passage, box, $('measure'), decorate, cols);
  if (state.page > state.pages.length - 1) state.page = Math.max(0, state.pages.length - 1);
  render();
}

function setMode(m) { if (!CP_MODES.includes(m)) return; state.mode = m; document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m)); }
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
setMode(state.mode);

/* paint: tap toggles, drag paints a run */
let painting = null;
function applyTo(el) {
  if (!el || !el.classList.contains('w')) return;
  const id = el.dataset.id;
  if (painting === 'add' ? state.marks[id] === state.mode : !state.marks[id]) return;
  el.classList.remove(...CP_MODES);
  if (painting === 'add') { state.marks[id] = state.mode; el.classList.add(state.mode); }
  else { delete state.marks[id]; }
  save(); markDirty();
}
const vbox = $('verses');
vbox.addEventListener('pointerdown', e => {
  if (groupView) return;
  const el = e.target.closest('.w'); if (!el) return;
  const cur = state.marks[el.dataset.id];
  painting = cur === state.mode ? 'remove' : 'add';
  applyTo(el); e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if (!painting) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.closest) applyTo(el.closest('.w'));
});
window.addEventListener('pointerup', () => { painting = null; });
window.addEventListener('pointercancel', () => { painting = null; });

// Keep the editor mounted so switching views never replaces the local draft.
// The remote uses this same board preview, including its realtime subscription.
function setView(group) {
  painting = null;
  groupView = group;
  $('highlightPanel').hidden = group;
  $('groupPanel').hidden = !group;
  $('highlightTab').setAttribute('aria-pressed', String(!group));
  $('groupTab').setAttribute('aria-pressed', String(group));
  try { sessionStorage.setItem(VIEW_KEY, group ? 'group' : 'highlight'); } catch (e) {}
  if (group) {
    const frame = $('groupPreview');
    if (!frame.getAttribute('src')) {
      const url = new URL(cpURL('index.html'));
      url.searchParams.set('view', 'preview');
      frame.src = url.href;
    }
  } else relayout();
}
$('highlightTab').onclick = () => setView(false);
$('groupTab').onclick = () => setView(true);
$('toLive').onclick = () => setView(true);
$('toHighlight').onclick = () => setView(false);

function go(d) { const n = state.page + d; if (n < 0 || n >= state.pages.length) return; state.page = n; render(); }
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('passage').onchange = e => { state.passage = e.target.value; state.page = 0; save(); relayout(); };
$('clear').onclick = () => {
  document.querySelectorAll('#verses .w').forEach(el => { delete state.marks[el.dataset.id]; el.classList.remove(...CP_MODES); });
  save(); markDirty();
};
window.addEventListener('keydown', e => {
  if (groupView || e.target.closest('.view-toggle') || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
  else if (e.key === '1') setMode(CP_MODES[0]); else if (e.key === '2') setMode(CP_MODES[1]);
});

/* Debounced autosave, serialized so older requests cannot overwrite newer marks. */
const sb = cpClient();
let saveTimer, saving = false, revision = 0, savedRevision = 0;
function setStatus(msg, cls) { const s = $('status'); s.textContent = msg; s.className = 'status' + (cls ? ' ' + cls : ''); }
function markDirty() {
  revision++;
  state.pendingSync = true;
  save();
  setStatus('Saving…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushMarks, 400);
}
async function flushMarks() {
  if (saving || savedRevision === revision) return;
  saving = true;
  const sendingRevision = revision;
  const row = { lesson: LESSON.slug, device_id: state.deviceId, marks: { ...state.marks }, updated_at: new Date().toISOString() };
  try {
    const { error } = await sb.from(CP_CONFIG.table).upsert(row, { onConflict: 'device_id,lesson' });
    if (error) throw error;
    savedRevision = sendingRevision;
    if (savedRevision === revision) {
      state.pendingSync = false; save();
      setStatus('Saved', 'ok');
    }
  } catch (error) {
    setStatus('Not saved. Retrying…', 'err');
  } finally {
    saving = false;
    if (savedRevision !== revision) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushMarks, savedRevision === sendingRevision ? 400 : 3000);
    }
  }
}
window.addEventListener('online', flushMarks);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { clearTimeout(saveTimer); flushMarks(); }
});
// Retry unsynced local edits on return, including a previously cleared set of marks.
if (state.pendingSync) markDirty();

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 120); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(relayout);
relayout();
try { if (sessionStorage.getItem(VIEW_KEY) === 'group') setView(true); } catch (e) {}
}).catch(cpShowError);
</script>
</body>
</html>
