<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walk in the Light of Your Fire — Presenter Screen</title>
<style>
  html,body{height:100%;margin:0;background:#1a1714;overflow:hidden}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  #board,#video{visibility:hidden;pointer-events:none}
  #video{background:#000}
  body.board #board,body.video #video{visibility:visible;pointer-events:auto}
  body.board #deck,body.video #deck{visibility:hidden;pointer-events:none}
  .nav{position:fixed;top:12px;right:14px;display:none;gap:8px;z-index:10}
  body.board .nav,body.video .nav{display:flex}
  .nav button{font:600 15px Figtree,system-ui,sans-serif;background:rgba(27,36,48,.85);color:#ECE7DC;border:1px solid #2C3846;border-radius:999px;padding:.5em 1em;cursor:pointer}
  .nav button:hover{border-color:#93A0AE}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font:14px system-ui,sans-serif;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.on{opacity:1}
  /* Shown until the page has been clicked once, which browsers require before video with sound can start remotely. */
  #arm{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:20;cursor:pointer}
  #arm div{background:#1B2430;color:#ECE7DC;border:1px solid #2C3846;border-radius:16px;padding:22px 30px;font:500 22px Figtree,system-ui,sans-serif;text-align:center;max-width:32em}
  #arm small{display:block;margin-top:8px;color:#93A0AE;font-size:15px}
  body.armed #arm{display:none}
  /* Shown if the browser still refuses to start the clip without a click on the video itself. */
  #playBtn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:15;background:rgba(0,0,0,.35);cursor:pointer}
  #playBtn span{width:120px;height:120px;border-radius:50%;background:#ECE7DC;color:#10151C;display:flex;align-items:center;justify-content:center;font-size:52px;padding-left:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  body.needclick #playBtn{display:flex}
  /* Older duplicate tabs go to standby so only one screen plays audio. */
  #standby{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#10151C;z-index:30;color:#ECE7DC;font:500 22px Figtree,system-ui,sans-serif;text-align:center;padding:40px}
  #standby small{display:block;margin-top:10px;color:#93A0AE;font-size:15px}
  body.standby #standby{display:flex}
</style>
</head>
<body>
<iframe id="deck" src="deck.html" title="Slides"></iframe>
<iframe id="board" src="index.html" title="Live highlight board"></iframe>
<div id="video"><div id="yt"></div></div>
<div class="nav">
  <button id="back">&#8592;</button>
  <button id="fwd">&#8594;</button>
</div>
<div id="toast"></div>
<div id="arm"><div>Click anywhere once to enable video and sound<small>Browsers need one click on this screen before the clip can be started from your phone.</small></div></div>
<div id="playBtn" title="Play clip"><span>&#9654;</span></div>
<div id="standby"><div>This presenter screen is on standby<small>A newer copy of this page is open in another tab or window. Close this one, or click here to make it the active screen.</small></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script src="notes-data.js"></script>
<script>
const SEQ = CP_SEQUENCE.map(s => s.pos);
const VIDEO = CP_VIDEO;                 // from notes-data.js: { pos, id, start, end }
const sb = cpClient();
const deck = document.getElementById('deck');
let pos = null;                         // '1'..'14' or 'board'
let hidden = [];                        // positions skipped by next/prev
let videoStamp = 0;                     // last video command applied

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1200); }
function labelFor(p) { return p === 'board' ? 'Board' : 'Slide ' + p; }
function neighbor(d) {
  let i = SEQ.indexOf(pos);
  while (true) { i += d; if (i < 0 || i >= SEQ.length) return null; if (!hidden.includes(SEQ[i])) return SEQ[i]; }
}
function paintNav() {
  const b = neighbor(-1), f = neighbor(1);
  document.getElementById('back').textContent = b ? '← ' + labelFor(b) : '←';
  document.getElementById('fwd').textContent = f ? labelFor(f) + ' →' : '→';
  document.getElementById('back').disabled = !b; document.getElementById('fwd').disabled = !f;
}

/* Show a position on screen. */
function apply(p, { fromRemote = false } = {}) {
  if (!SEQ.includes(p) || p === pos) return;
  const leavingVideo = pos === VIDEO.pos;
  pos = p;
  document.body.classList.toggle('board', p === 'board');
  document.body.classList.toggle('video', p === VIDEO.pos);
  if (leavingVideo && player && player.pauseVideo) try { player.pauseVideo(); } catch (e) {}
  if (p !== 'board') {
    try { const w = deck.contentWindow; if (w && w.location.hash !== '#' + p) w.location.hash = '#' + p; } catch (e) {}
  }
  paintNav();
  if (fromRemote) toast(labelFor(p));
}
async function publish(p) {
  apply(p);
  await sb.from('control').update({ position: p, updated_at: new Date().toISOString() }).eq('id', 1);
}
function step(d) { const n = neighbor(d); if (n) publish(n); }

function handleKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return false;
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey)) step(1);
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey)) step(-1);
  else if (k === 'Home') publish('1');
  else if (k === 'End') publish(SEQ[SEQ.length - 1]);
  else if (k === 'b' || k === 'B') publish('board');
  else if (/^[1-9]$/.test(k)) publish(k);
  else return false;
  e.preventDefault(); e.stopImmediatePropagation();
  return true;
}

/* Take over keyboard/click navigation inside the deck so the board sits between 8 and 9 and hidden slides are skipped. */
deck.addEventListener('load', () => {
  const w = deck.contentWindow, d = deck.contentDocument;
  w.addEventListener('keydown', handleKey, true);
  d.addEventListener('click', e => {
    if (e.button !== 0 || !e.target || e.target.closest('a')) return;
    e.stopImmediatePropagation();
    step(e.clientX < w.innerWidth / 2 ? -1 : 1);
  }, true);
  w.addEventListener('hashchange', () => {
    const m = /^#(\d+)$/.exec(w.location.hash);
    if (m && pos !== 'board' && m[1] !== pos) publish(m[1]);
  });
  load();
});
window.addEventListener('keydown', handleKey, true);
document.getElementById('back').onclick = () => step(-1);
document.getElementById('fwd').onclick = () => step(1);
document.getElementById('board').addEventListener('load', () => {
  const w = document.getElementById('board').contentWindow;
  w.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === 'n' || e.key === 'N') { step(1); e.preventDefault(); }
    else if (e.key === 'Backspace' || e.key === 'p' || e.key === 'P') { step(-1); e.preventDefault(); }
  }, true);
});

/* Video clip (YouTube IFrame API), controlled from the phone or by clicking it here. */
let player = null, playerReady = false;
window.onYouTubeIframeAPIReady = function () {
  if (player) return;
  player = new YT.Player('yt', {
    videoId: VIDEO.id, width: '100%', height: '100%',
    playerVars: { start: VIDEO.start, end: VIDEO.end, controls: 1, rel: 0, modestbranding: 1, playsinline: 1 },
    events: { onReady: () => { playerReady = true; }, onStateChange: ev => { if (ev.data === YT.PlayerState.PLAYING) document.body.classList.remove('needclick'); if (ev.data === YT.PlayerState.ENDED) toast('Clip finished'); } },
  });
};
(function () { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();
document.getElementById('video').style.cssText += ';position:absolute;inset:0';
document.getElementById('yt').style.cssText = 'position:absolute;inset:0;width:100%;height:100%';

/* One click arms the page (user activation) so remote play with sound is allowed. */
function armed() { return document.body.classList.contains('armed'); }
function arm() { document.body.classList.add('armed'); }
if (navigator.userActivation && navigator.userActivation.hasBeenActive) arm();
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, arm, true));
document.getElementById('arm').addEventListener('click', e => { arm(); e.stopPropagation(); });
deck.addEventListener('load', () => { ['pointerdown', 'keydown'].forEach(ev => deck.contentWindow.addEventListener(ev, arm, true)); });
document.getElementById('board').addEventListener('load', () => { ['pointerdown', 'keydown'].forEach(ev => document.getElementById('board').contentWindow.addEventListener(ev, arm, true)); });

let pendingPlay = null;
function tryPlay(restart) {
  if (restart) player.seekTo(VIDEO.start, true);
  player.playVideo();
  clearTimeout(pendingPlay);
  pendingPlay = setTimeout(() => {
    const s = player.getPlayerState();
    if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) document.body.classList.add('needclick');
  }, 1500);
}
document.getElementById('playBtn').addEventListener('click', () => { document.body.classList.remove('needclick'); arm(); try { player.playVideo(); } catch (e) {} });

/* Only one presenter screen per browser: the newest tab is active, older ones stand by. */
const TAB_ID = Math.random().toString(36).slice(2), bc = 'BroadcastChannel' in window ? new BroadcastChannel('cp-presenter') : null;
let standby = false;
function setStandby(on) {
  standby = on; document.body.classList.toggle('standby', on);
  if (on && player && player.pauseVideo) try { player.pauseVideo(); } catch (e) {}
}
function claim() { setStandby(false); if (bc) bc.postMessage({ type: 'claim', id: TAB_ID }); }
if (bc) bc.onmessage = e => { if (e.data && e.data.type === 'claim' && e.data.id !== TAB_ID) setStandby(true); };
claim();
document.getElementById('standby').addEventListener('click', claim);
window.addEventListener('pagehide', () => { if (!standby && bc) bc.postMessage({ type: 'closed', id: TAB_ID }); });

function applyVideo(v) {
  if (standby) { if (v && v.t) videoStamp = v.t; return; }
  if (!v || !v.t || v.t === videoStamp) return;
  videoStamp = v.t;
  if (!playerReady) { setTimeout(() => { videoStamp = 0; applyVideo(v); }, 500); return; }
  if (pos !== VIDEO.pos) apply(VIDEO.pos, { fromRemote: true });
  try {
    if (v.cmd === 'play') tryPlay(false);
    else if (v.cmd === 'restart') tryPlay(true);
    else if (v.cmd === 'pause') { clearTimeout(pendingPlay); document.body.classList.remove('needclick'); player.pauseVideo(); }
  } catch (e) {}
}
/* Follow the phone remote. */
function applyRow(row, fromRemote) {
  if (!row) return;
  if (Array.isArray(row.hidden)) { hidden = row.hidden.map(String); paintNav(); }
  if (row.position) apply(row.position, { fromRemote });
  applyVideo(row.video);
}
async function load() {
  const { data } = await sb.from('control').select('position,hidden,video').eq('id', 1).single();
  // Ignore video commands older than 20s on first load (so a reload doesn't replay), but honor a fresh one.
  if (data) { if (!videoStamp && data.video && data.video.t && Date.now() - data.video.t > 20000) videoStamp = data.video.t; applyRow(data, true); }
}
sb.channel('control-live')
  .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'control' }, payload => applyRow(payload.new, true))
  .subscribe();
setInterval(load, 3000);
</script>
</body>
</html>
