<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Covenant Pattern — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Figtree:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  /* Wide live boards use the same fixed TV canvas as the presenter. */
  body.tv-board .app{position:absolute;width:1920px;height:1080px;transform-origin:top left}
  .tv-board .stage{padding:40px 80px;gap:24px}
  .tv-board .ref h1{font-size:44px}
  .tv-board .ref .hint{font-size:20px}
  .tv-board .verses{--vgap:20px;font-size:40px;max-width:none}
  .tv-board .verses.cols{column-gap:72px;font-size:40px}
  .tv-board .bar{padding:12px 40px;flex-wrap:nowrap}
  .tv-board .legend,.tv-board .join .url{font-size:18px}
  .tv-board .join .url{max-width:410px}
  .tv-board .join img{width:96px}
  .tv-board button{font-size:20px}
  .tv-board .arrow{font-size:22px}
  .tv-board select{font-size:18px}
  .tv-board .pager .count{font-size:19px}
  body.preview{overflow:auto;height:auto}
  .preview .app{height:auto;min-height:100vh}
  .preview .verses{flex:none;touch-action:pan-y;user-select:text;-webkit-user-select:text;font-size:22px}
  .preview .stage{padding-left:max(clamp(16px,5vw,96px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,5vw,96px),env(safe-area-inset-right,0px))}
  .preview .bar{position:sticky;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .preview .join,.preview #reset,.preview .pager{display:none}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="ref">
      <h1 id="ref"></h1>
      <span class="hint" id="hint">Waiting for highlights…</span>
    </div>
    <div class="verses" id="verses" aria-live="polite"></div>
  </main>
  <nav class="bar" aria-label="Controls">
    <div class="legend"></div>
    <div class="extras">
      <select id="passage" aria-label="Passage"></select>
      <div class="join">
        <img id="qr" alt="QR code to the highlight page">
        <span class="url">Join at <b id="joinUrl"></b></span>
      </div>
      <button class="ghost" id="reset" title="Host only: delete everyone's submissions">Reset</button>
    </div>
    <div class="pager">
      <button class="arrow" id="prev" aria-label="Previous verses">&#8592;</button>
      <span class="count" id="count">1 / 1</span>
      <button class="arrow" id="next" aria-label="Next verses">&#8594;</button>
    </div>
  </nav>
</div>
<!-- Keep measurement outside the scaled app so pagination uses canvas pixels. -->
<div class="verses measure" id="measure" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js?v=20261025-2"></script>
<script>
cpReady.then(() => {
const $ = id => document.getElementById(id);
const preview = new URLSearchParams(location.search).get('view') === 'preview';
if (preview) document.body.classList.add('preview');
const state = { passage: Object.keys(PASSAGES)[0], page: 0, pages: [], rows: [] };

/* Join link + QR (QR generated by a public image API; nothing sensitive in the URL). */
const joinURL = new URL(cpJoinURL());
joinURL.searchParams.delete('view');
const joinHref = joinURL.href;
$('joinUrl').textContent = joinHref.replace(/^https?:\/\//, '');
if (!preview) $('qr').src = cpQRCodeURL(joinHref);

/* Tally: for each word id, how many people chose each color. */
let tally = {}, submitters = 0;
function rebuildTally() {
  tally = {}; submitters = state.rows.length;
  for (const r of state.rows) {
    for (const [id, m] of Object.entries(r.marks || {})) {
      if (!CP_COLORS[m]) continue;
      (tally[id] ||= Object.fromEntries(CP_MODES.map(key => [key, 0])))[m]++;
    }
  }
}
/* Opacity: one person is light; grows with each extra person until the whole group agrees. */
function alphaFor(count) {
  const denom = Math.max(submitters - 1, 4);
  return Math.min(1, 0.22 + 0.78 * ((count - 1) / denom));
}
function decorate(id) {
  const t = tally[id]; if (!t) return { cls: '', style: '' };
  const kind = CP_MODES.reduce((best, key) => t[key] > t[best] ? key : best);
  const count = t[kind]; if (!count) return { cls: '', style: '' };
  const a = alphaFor(count);
  return { cls: a > 0.5 ? 'dark' : '', style: `background:rgba(${CP_COLORS[kind].rgb},${a.toFixed(2)})` };
}
function render() {
  const pg = state.pages[state.page] || [];
  const html = pageHTML(state.passage, pg, decorate);
  $('verses').innerHTML = $('verses').classList.contains('cols') && pg.length === 1
    ? '<div class="col">' + html + '</div><div class="col"></div>' : html;
  $('ref').textContent = refLabel(state.passage, pg);
  $('count').textContent = `${state.page + 1} / ${state.pages.length}`;
  $('prev').disabled = state.page === 0;
  $('next').disabled = state.page >= state.pages.length - 1;
  $('passage').value = state.passage;
  $('hint').textContent = submitters
    ? `${submitters} submission${submitters === 1 ? '' : 's'}`
    : (preview ? '0 submissions · Waiting for highlights…' : 'Waiting for highlights…');
}
function relayout() {
  if (preview) { state.pages = [[PASSAGES[state.passage].verses]]; state.page = 0; render(); return; }
  const wide = innerWidth >= 1000;
  document.body.classList.toggle('tv-board', wide);
  const app = document.querySelector('.app');
  if (wide) {
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    app.style.transform = `scale(${scale})`;
    app.style.left = (innerWidth - 1920 * scale) / 2 + 'px';
    app.style.top = (innerHeight - 1080 * scale) / 2 + 'px';
  } else { app.style.transform = ''; app.style.left = ''; app.style.top = ''; }
  const box = $('verses'), cols = wide ? 2 : colsFor(box);
  box.classList.toggle('cols', cols > 1);
  state.pages = paginate(state.passage, box, $('measure'), null, cols);
  if (state.page > state.pages.length - 1) state.page = Math.max(0, state.pages.length - 1);
  render();
}

// Explicit API for the presenter: independent of keyboard focus and event timing.
window.cpBoardState = () => ({ page: state.page, pages: state.pages.length });
window.cpSetBoardPage = page => {
  if (!Number.isInteger(page) || !state.pages.length) return;
  state.page = Math.max(0, Math.min(page, state.pages.length - 1));
  render();
};
function reportBoardPage() {
  if (window.parent !== window && typeof window.parent.cpBoardChanged === 'function') {
    window.parent.cpBoardChanged(window.cpBoardState());
  }
}
function go(d) {
  const n = state.page + d;
  if (n < 0 || n >= state.pages.length) return;
  window.cpSetBoardPage(n);
  reportBoardPage();
}
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('passage').onchange = e => { state.passage = e.target.value; state.page = 0; relayout(); };
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { go(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
});

/* Data: load everything, then listen for live changes (plus a slow poll as a safety net). */
const sb = cpClient();
async function load() {
  const { data, error } = await sb.from(CP_CONFIG.table).select('device_id,marks,updated_at').eq('lesson', LESSON.slug).not('device_id', 'in', '(' + Object.values(CP_CONTROL_IDS).join(',') + ')');
  if (error) { $('hint').textContent = 'Could not load: ' + error.message; return; }
  state.rows = data || []; rebuildTally(); render();
}
sb.channel('submissions-live-' + LESSON.slug)
  .on('postgres_changes', { event: '*', schema: 'public', table: CP_CONFIG.table, filter: 'lesson=eq.' + LESSON.slug }, load)
  .subscribe();
setInterval(load, 5000);

$('reset').onclick = async () => {
  if (preview) return;
  if (!confirm('Delete every submission for this lesson so the board starts blank?')) return;
  const { error } = await sb.from(CP_CONFIG.table).delete().eq('lesson', LESSON.slug).not('device_id', 'in', '(' + Object.values(CP_CONTROL_IDS).join(',') + ')');
  if (error) alert('Reset failed: ' + error.message); else load();
};

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(relayout, 120); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(relayout);
relayout();
load();
}).catch(cpShowError);
</script>
</body>
</html>
